<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}Registre National des Décès — Cameroun{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --ink:    #0d1117;
  --ink2:   #161b22;
  --panel:  #1c2128;
  --panel2: #21262d;
  --border: rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.12);
  --crimson: #c0392b;
  --crimson2: #e74c3c;
  --gold:   #d4a843;
  --gold2:  #e8c06d;
  --muted:  rgba(255,255,255,.42);
  --text:   rgba(255,255,255,.87);
  --sidebar-w: 256px;
  --topbar-h: 60px;
  --radius: 10px;
  --shadow: 0 4px 20px rgba(0,0,0,.4);
}
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
html { font-size: 15px; }
body { font-family: 'Karla', sans-serif; background: var(--ink); color: var(--text); min-height: 100vh; }
h1,h2,h3,h4,h5 { font-family: 'Playfair Display', serif; }
a { text-decoration: none; color: inherit; }

/* ── SIDEBAR ─────────────────────────────── */
.sidebar {
  position: fixed; top:0; left:0;
  width: var(--sidebar-w); height: 100vh;
  background: var(--ink2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 200;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
}
.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.logo-mark {
  width: 38px; height: 38px; background: var(--crimson);
  border-radius: 9px; display: grid; place-items: center;
  font-size: 16px; flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(192,57,43,.35);
}
.logo-text { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; line-height: 1.2; }
.logo-sub  { font-family: 'Karla', sans-serif; font-size: .68rem; color: var(--muted); margin-top: 1px; letter-spacing: .04em; }

.nav-section { padding: 16px 12px 0; flex: 1; }
.nav-label { font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,.22); padding: 0 8px 8px; font-weight: 600; }
.nav-link {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 8px; margin-bottom: 2px;
  font-size: .88rem; font-weight: 500; color: var(--muted);
  transition: all .18s;
}
.nav-link i { width: 18px; text-align: center; font-size: .88rem; }
.nav-link:hover { background: rgba(255,255,255,.05); color: var(--text); }
.nav-link.active {
  background: rgba(192,57,43,.18);
  color: #f08070;
  border-left: 2px solid var(--crimson);
}

.sidebar-footer {
  padding: 14px 12px;
  border-top: 1px solid var(--border);
}
.user-tile {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--panel);
  border-radius: 9px; border: 1px solid var(--border);
}
.user-av {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--crimson), var(--gold));
  display: grid; place-items: center;
  font-family: 'Playfair Display', serif; font-size: .85rem; font-weight: 700;
}
.user-nm  { font-size: .82rem; font-weight: 600; }
.user-rl  { font-size: .7rem; color: var(--muted); }
.btn-logout {
  margin-left: auto; background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 5px; border-radius: 6px; transition: color .2s; font-size: .85rem;
}
.btn-logout:hover { color: var(--crimson2); }

/* ── MAIN ─────────────────────────────── */
.main { margin-left: var(--sidebar-w); min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 100;
  height: var(--topbar-h); padding: 0 28px;
  background: rgba(13,17,23,.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-date { font-size: .78rem; color: var(--muted); }
.btn-menu { display: none; background:none; border:none; color:var(--text); font-size: 1.2rem; cursor:pointer; }

.content { padding: 24px 28px; }

/* ── CARDS ─────────────────────────────── */
.card {
  background: var(--ink2); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.card-hd { padding: 18px 22px 0; }
.card-bd { padding: 18px 22px; }
.card-title { font-family: 'Playfair Display', serif; font-size: .95rem; font-weight: 600; }

/* ── STAT CARDS ─────────────────────────── */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 22px; }
.sc {
  background: var(--ink2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  position: relative; overflow: hidden;
  transition: border-color .2s, transform .2s;
}
.sc:hover { border-color: var(--border2); transform: translateY(-1px); }
.sc::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
.sc.crimson::before { background: var(--crimson); }
.sc.gold::before    { background: var(--gold); }
.sc.teal::before    { background: #27ae8f; }
.sc.slate::before   { background: #5d8aa8; }
.sc-icon {
  width: 42px; height: 42px; border-radius: 9px;
  display: grid; place-items: center; font-size: 1rem; margin-bottom: 14px;
}
.sc-icon.crimson { background: rgba(192,57,43,.15); color: #f08070; }
.sc-icon.gold    { background: rgba(212,168,67,.12); color: var(--gold2); }
.sc-icon.teal    { background: rgba(39,174,143,.12); color: #5ac8a8; }
.sc-icon.slate   { background: rgba(93,138,168,.12); color: #8ec8e8; }
.sc-val  { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; line-height: 1; }
.sc-lbl  { font-size: .78rem; color: var(--muted); margin-top: 6px; font-weight: 500; }

/* ── TABLE ─────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
thead th {
  text-align: left; padding: 10px 14px;
  font-size: .7rem; text-transform: uppercase; letter-spacing: .09em;
  color: var(--muted); border-bottom: 1px solid var(--border);
  background: var(--panel); font-family: 'Karla', sans-serif; font-weight: 600;
}
tbody tr { border-bottom: 1px solid rgba(255,255,255,.04); transition: background .15s; }
tbody tr:hover { background: rgba(255,255,255,.03); }
tbody td { padding: 12px 14px; vertical-align: middle; }

/* ── BADGE ─────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 20px;
  font-size: .72rem; font-weight: 600;
}
.bm   { background: rgba(93,138,168,.2); color: #8ec8e8; }
.bf   { background: rgba(212,168,67,.15); color: var(--gold2); }
.bcr  { background: rgba(192,57,43,.2);  color: #f08070; }
.bgr  { background: rgba(39,174,143,.15); color: #5ac8a8; }
.bgy  { background: rgba(212,168,67,.15); color: var(--gold2); }
.bsl  { background: rgba(255,255,255,.08); color: var(--muted); }

/* ── BUTTONS ─────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: 8px;
  font-family: 'Karla', sans-serif; font-size: .86rem; font-weight: 600;
  cursor: pointer; border: none; transition: all .18s;
}
.btn-primary { background: var(--crimson); color: white; }
.btn-primary:hover { background: var(--crimson2); }
.btn-gold    { background: rgba(212,168,67,.15); color: var(--gold2); border: 1px solid rgba(212,168,67,.2); }
.btn-gold:hover { background: rgba(212,168,67,.25); }
.btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--border2); color: var(--text); }
.btn-sm  { padding: 5px 11px; font-size: .78rem; }
.btn-icon { width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 7px; }

/* ── FORMS ─────────────────────────────── */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: .72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .09em;
  color: var(--muted); margin-bottom: 7px;
}
.form-control {
  width: 100%; padding: 10px 13px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-family: 'Karla', sans-serif; font-size: .9rem;
  outline: none; transition: border .2s, box-shadow .2s;
}
.form-control:focus { border-color: var(--crimson); box-shadow: 0 0 0 3px rgba(192,57,43,.12); }
.form-control option { background: var(--panel2); }
textarea.form-control { resize: vertical; min-height: 80px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

.search-bar {
  display: flex; align-items: center; gap: 9px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 13px;
  transition: border .2s;
}
.search-bar:focus-within { border-color: var(--crimson); }
.search-bar input { border:none; outline:none; background:transparent; color:var(--text); font-family:'Karla',sans-serif; font-size:.88rem; flex:1; }
.search-bar input::placeholder { color: rgba(255,255,255,.2); }
.search-bar i { color: rgba(255,255,255,.25); font-size: .88rem; }

/* ── MODAL ─────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
  display: none; place-items: center;
}
.modal-overlay.active { display: grid; }
.modal {
  background: var(--ink2); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: 0 24px 80px rgba(0,0,0,.6);
  width: min(620px, 96vw); max-height: 92vh; overflow-y: auto;
}
.modal-hd {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--ink2); z-index: 1;
}
.modal-bd { padding: 22px 24px; }
.modal-ft {
  padding: 14px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
  position: sticky; bottom: 0; background: var(--ink2);
}
.btn-close { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.1rem; transition:color .2s; }
.btn-close:hover { color: var(--crimson2); }

/* ── TOAST ─────────────────────────────── */
.toast {
  position: fixed; bottom: 22px; right: 22px; z-index: 900;
  background: var(--panel2); border: 1px solid var(--border2);
  color: var(--text); padding: 13px 18px; border-radius: 10px;
  font-size: .86rem; display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow); max-width: 320px;
  transform: translateY(70px); opacity: 0;
  transition: all .3s cubic-bezier(.4,0,.2,1);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok  { border-left: 3px solid #27ae8f; }
.toast.err { border-left: 3px solid var(--crimson); }

/* ── CHART ─────────────────────────────── */
.chart-box { position: relative; height: 220px; }

/* ── MISC ─────────────────────────────── */
.loader { display:grid; place-items:center; padding:40px; }
.spinner {
  width: 26px; height: 26px;
  border: 3px solid rgba(192,57,43,.2); border-top-color: var(--crimson);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align:center; padding:48px; color:var(--muted); font-size:.9rem; }
.empty-state i { font-size: 2.5rem; display:block; margin-bottom:14px; opacity:.3; }
.section-sep { height: 1px; background: var(--border); margin: 22px 0; }

/* ── RESPONSIVE ─────────────────────────── */
@media (max-width: 1024px) {
  .stats-grid { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .btn-menu { display: block; }
  .content { padding: 16px; }
  .topbar { padding: 0 16px; }
  .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
}

.overlay-mob {
  position: fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:199; display:none;
}
.overlay-mob.show { display:block; }
</style>
{% block head %}{% endblock %}
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">⚰</div>
    <div>
      <div class="logo-text">RN-Décès</div>
      <div class="logo-sub">Cameroun — Officiel</div>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Navigation</div>
    <a href="/dashboard" class="nav-link {% if request.path=='/dashboard' %}active{% endif %}">
      <i class="fa-solid fa-chart-bar"></i> Tableau de bord
    </a>
    <a href="/deces" class="nav-link {% if request.path=='/deces' %}active{% endif %}">
      <i class="fa-solid fa-file-medical"></i> Registre des décès
    </a>
    <a href="/rapport" class="nav-link {% if request.path=='/rapport' %}active{% endif %}">
      <i class="fa-solid fa-chart-pie"></i> Rapports & Analyses
    </a>
  </div>

  <div class="sidebar-footer">
    <div class="user-tile">
      <div class="user-av">{{ (user_name or 'U')[0] }}</div>
      <div>
        <div class="user-nm">{{ user_name }}</div>
        <div class="user-rl">{{ role|capitalize }}</div>
      </div>
      <a href="/logout" class="btn-logout" title="Déconnexion">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
    </div>
  </div>
</aside>

<div class="overlay-mob" id="mobOverlay"></div>

<div class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="btn-menu" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title">{% block page_title %}{% endblock %}</div>
    </div>
    <div class="topbar-right">
      <span class="topbar-date" id="todayDate"></span>
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>

<div class="toast" id="toast">
  <i id="toastIc"></i>
  <span id="toastTxt"></span>
</div>

<script>
  document.getElementById('todayDate').textContent =
    new Date().toLocaleDateString('fr-FR', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  const sidebar = document.getElementById('sidebar');
  const mobOverlay = document.getElementById('mobOverlay');
  document.getElementById('menuBtn').addEventListener('click', () => {
    sidebar.classList.toggle('open');
    mobOverlay.classList.toggle('show');
  });
  mobOverlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    mobOverlay.classList.remove('show');
  });

  function showToast(msg, type='ok') {
    const t = document.getElementById('toast');
    const ic = document.getElementById('toastIc');
    document.getElementById('toastTxt').textContent = msg;
    t.className = `toast ${type} show`;
    ic.className = type === 'ok'
      ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark';
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  async function api(url, opts={}) {
    const res = await fetch(url, {
      headers: {'Content-Type': 'application/json'}, ...opts
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({error: 'Erreur réseau'}));
      throw new Error(e.error || 'Erreur');
    }
    return res.json();
  }

  function openModal(id)  { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  document.querySelectorAll('[data-close]').forEach(b =>
    b.addEventListener('click', () => closeModal(b.dataset.close))
  );
</script>
{% block scripts %}{% endblock %}
</body>
</html>
